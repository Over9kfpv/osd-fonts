[project]
name = "osd-fonts"
version = "0.1.0"
description = "Retro bitmap fonts and icon sets for Betaflight analog OSD (MAX7456)"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
